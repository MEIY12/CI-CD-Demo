name: Delete testing environment after PR is closed

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  get-migration-files:
    runs-on: ubuntu-latest  # windows-latest | macos-latest
    name: Get Migration Files
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3

      - name: Delete Env
        id: delete-env
        # Create env name based on pull request title and number
        # Switch development alias back to main environment
        # Delete environment created for pull request
        run: |
          npm install --location=global contentful-cli
          ENV=$(echo "${{github.event.pull_request.title}}-${{github.event.pull_request.number}}" | sed -e 's/[][\\^*+.$()\/]/\-/g' | tr ' ' '-' | tr '[:upper:]' '[:lower:]')  | cut -c-40
          echo ${ENV}
          contentful space environment-alias update -s=${{ secrets.CF_SPACE_ID }} -a=development --e=main --mt=${{ secrets.CF_CMA_KEY }}
          contentful space environment delete -s=${{ secrets.CF_SPACE_ID }} --e=${ENV} --mt=${{ secrets.CF_CMA_KEY }}
